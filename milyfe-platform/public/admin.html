<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer/Admin — MiLyfe</title><style>

ize:1.05rem}.cards,.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.platform-card{padding:24px;box-shadow:0 12px 34px rgba(7,51,95,.06)}.card-icon{width:46px;height:46px;border-radius:16px;background:var(--aqua);display:grid;place-items:center;color:var(--blue);font-size:1.35rem;margin-bottom:14px}.card h3,.platform-card h4{margin:0 0 8px;color:var(--navy);font-size:1.22rem}.formation{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.formation-card{background:white;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 34px rgba(7,51,95,.06)}.formation-no{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--teal));color:white;font-weight:1000;margin-bottom:14px}.formation-card h3{margin:0 0 8px;color:var(--navy)}.formation-card p{margin:0;color:var(--muted)}.shell{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:42px 0}.auth-card{width:min(560px,calc(100% - 28px));background:white;border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);padding:30px}.auth-card img{width:148px;margin-bottom:20px}.auth-card h1{font-size:clamp(2.2rem,5vw,3.7rem)}.form-grid{display:grid;gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{color:var(--navy);font-weight:850;font-size:.93rem}.field input,.field select,.field textarea,.mini-form input,.mini-form select,.mini-form textarea{width:100%;border:1px solid #cfe0e6;background:#fbfeff;color:var(--ink);border-radius:16px;padding:13px 14px;outline:none}.field textarea,.mini-form textarea{min-height:112px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,169,145,.1)}.hint,.muted{color:var(--muted)}.error{color:var(--rose);font-weight:850;min-height:1.4em}.success{background:var(--mint);border:1px solid #b5eee3;bor <main class="dash"><div class="wrap"><section class="dash-hero"><div><h1>Formation Command Center.</h1><p>Manage citizens, Circle readiness, roles, statuses, and first assemblies.</p></div><div class="dash-stats" id="stats"></div></section><div class="tabs"><button class="tab-btn active" onclick="tab='citizens';render()">Citizens</button><button class="tab-btn" onclick="tab='events';render()">Assemblies</button><button class="tab-btn" onclick="tab='circles';render()">Circles</button><button class="tab-btn" onclick="tab='export';render()">Export</button></div><div id="adminApp"></div></div></main>
<script>
let ML_CSRF = '';
let ML_USER = null;
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function esc(v){ return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])); }
async function api(path, opts={}){
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if(ML_CSRF && !['GET','HEAD'].includes(opts.method || 'GET')) headers['x-csrf-token'] = ML_CSRF;
  const res = await fetch(path, { credentials:'same-origin', ...opts, headers, body: opts.body && typeof opts.body !== 'string' ? JSON.stringify(opts.body) : opts.body });
  let data = {}; try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
async function loadMe(required=false, roles=null){
  try{
    const data = await api('/api/me'); ML_CSRF = data.csrf; ML_USER = data.user;
    if(roles && !roles.includes(ML_USER.role)) location.href='/citizen';
    return ML_USER;
  }catch(e){ if(required) location.href='/login.html?next=' + encodeURIComponent(location.pathname); return null; }
}
async function logout(){ try{ await api('/api/auth/logout', { method:'POST' }); }catch(e){} location.href='/'; }
function setNavUser(){ const el=$('#navUser'); if(el && ML_USER) el.textContent = ML_USER.profile?.firstName || ML_USER.profile?.name || ML_USER.email; }
function missionsFor(profile={}){
  const role = profile.suggestedRole || 'Founding Citizen';
  const base = ['Share your invite with 3 people','Add one community need to your Values Agenda','Save your first assembly RSVP'];
  if(role === 'Circle Organizer') return ['Identify 3 people to invite','Choose a possible meeting place','Save your first assembly RSVP','Add one community need to your Values Agenda','Share your invite with 3 people'];
  if(role === 'Builder') return ['List what you can build or create','Share your invite with 3 people','Add one community need to your Values Agenda','Save your first assembly RSVP'];
  if(role === 'Community Partner') return ['Add your organization or group name','Invite your community contact','Save your first assembly RSVP','Add one community need to your Values Agenda'];
  if(role === 'Formation Support') return ['Choose your support lane','Add one community need to your Values Agenda','Share your invite with 3 people','Save your first assembly RSVP'];
  return base;
}
function inviteUrl(profile){ return location.origin + (profile.inviteLink || `/onboarding.html?invite=${encodeURIComponent(profile.code || '')}`); }
async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); alert('Copied.'); }catch(e){ prompt('Copy this:', txt); } }
function formData(form){ const fd = new FormData(form); const out = {}; for(const [k,v] of fd.entries()){ if(out[k]) out[k] = Array.isArray(out[k]) ? [...out[k], v] : [out[k], v]; else out[k]=v; } return out; }

</script><script>
let state={citizens:[],stats:{},events:[]}; let tab='citizens';
async function init(){ await loadMe(true,['admin','organizer']); setNavUser(); await loadAdmin(); }
async function loadAdmin(){ state=await api('/api/admin/citizens'); render(); }
function render(){ $$('.tab-btn').forEach(b=>b.classList.remove('active')); $$('.tab-btn')[['citizens','events','circles','export'].indexOf(tab)]?.classList.add('active'); $('#stats').innerHTML=`<div class="dash-stat"><b>${state.stats.total||0}</b><span>Total citizens</span></div><div class="dash-stat"><b>${state.stats.organizers||0}</b><span>Organizer candidates</span></div><div class="dash-stat"><b>${state.stats.active||0}</b><span>Active citizens</span></div>`; if(tab==='citizens') citizensPanel(); if(tab==='events') eventsPanel(); if(tab==='circles') circlesPanel(); if(tab==='export') exportPanel(); }
function citizensPanel(){ const cities=[...new Set(state.citizens.map(u=>u.profile?.location).filter(Boolean))]; const roles=[...new Set(state.citizens.map(u=>u.profile?.suggestedRole).filter(Boolean))]; $('#adminApp').innerHTML=`<div class="filters"><input id="q" placeholder="Search name/email/city"><select id="city"><option value="">All cities</option>${cities.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="role"><option value="">All roles</option>${roles.map(r=>`<option>${esc(r)}</option>`).join('')}</select><select id="status"><option value="">All statuses</option><option>Onboarded</option><option>Circle pending</option><option>Circle matched</option><option>Assembly invited</option><option>Active citizen</option><option>Organizer candidate</option></select></div><div class="table-wrap"><table><thead><tr><th>Citizen</th><th>Location</th><th>Values</th><th>Role</th><th>Status / Circle</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>`; ['q','city','role','status'].forEach(id=>$('#'+id).addEventListener('input',drawRows)); drawRows(); }
function drawRows(){ const q=($('#q')?.value||'').toLowerCase(), city=$('#city')?.value||'', role=$('#role')?.value||'', status=$('#status')?.value||''; const rows=state.citizens.filter(u=>{const p=u.profile||{}; const hay=(p.name+' '+u.email+' '+p.location+' '+p.suggestedRole).toLowerCase(); return (!q||hay.includes(q))&&(!city||p.location===city)&&(!role||p.suggestedRole===role)&&(!status||p.status===status);}); $('#rows').innerHTML=rows.map(u=>{const p=u.profile||{}; return `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(u.email)}</span><br><span class="tag">${esc(p.code)}</span></td><td>${esc(p.location)}</td><td>${esc((p.priorities||[]).join(', '))}</td><td>${esc(p.suggestedRole)}<br><span class="muted">${esc((p.skills||[]).join(', '))}</span></td><td><select id="st_${u.id}"><option ${p.status==='Onboarded'?'selected':''}>Onboarded</option><option ${p.status==='Circle pending'?'selected':''}>Circle pending</option><option ${p.status==='Circle matched'?'selected':''}>Circle matched</option><option ${p.status==='Assembly invited'?'selected':''}>Assembly invited</option><option ${p.status==='Active citizen'?'selected':''}>Active citizen</option><option ${p.status==='Organizer candidate'?'selected':''}>Organizer candidate</option></select><input id="cir_${u.id}" value="${esc(p.assignedCircle||'')}" placeholder="Assigned Circle" style="margin-top:8px"></td><td><button class="btn btn-primary" onclick="saveCitizen('${u.id}')">Save</button></td></tr>`;}).join('') || '<tr><td colspan="6">No citizens match.</td></tr>'; }
async function saveCitizen(id){ const status=$('#st_'+id).value, assignedCircle=$('#cir_'+id).value; await api('/api/admin/citizens/'+id,{method:'PUT',body:{status,assignedCircle,circleStatus:assignedCircle?`Assigned to ${assignedCircle}`:undefined}}); await loadAdmin(); }
function eventsPanel(){ $('#adminApp').innerHTML=`<div class="platform-grid"><div class="platform-card"><h4>Create assembly/event</h4><div class="mini-form"><input id="eventTitle" placeholder="Title"><input id="eventDate" placeholder="Date/time"><input id="eventLocation" placeholder="Location or link"><textarea id="eventNotes" placeholder="Notes"></textarea><button class="btn btn-primary" onclick="createEvent()">Create event</button></div></div><div class="platform-card"><h4>Upcoming assemblies</h4><div class="need-list">${state.events.length?state.events.map(e=>`<div class="need"><b>${esc(e.title)}</b><small>${esc(e.date)} · ${esc(e.location)}<br>${esc(e.notes)}</small></div>`).join(''):'<p class="muted">No events yet.</p>'}</div></div><div class="platform-card"><h4>Organizer use</h4><p>Events created here appear inside every Citizen Dashboard under Circle Hub.</p></div></div>`; }
async function createEvent(){ const title=$('#eventTitle').value.trim(); if(!title) return alert('Title required.'); await api('/api/admin/events',{method:'POST',body:{title,date:$('#eventDate').value,location:$('#eventLocation').value,notes:$('#eventNotes').value}}); await loadAdmin(); tab='events'; render(); }
async function circlesPanel(){ const data = await api('/api/circles'); const circles = data.circles || []; $('#adminApp').innerHTML = `<div class="platform-grid"><div class="platform-card"><h4>Auto-Match Founding Circles</h4><p>Group unassigned citizens into Circles of 7-13 based on location and values focus.</p><button class="btn btn-primary" onclick="runCircleMatch()">Run Auto-Match (7-13)</button></div><div class="platform-card"><h4>Formed Circles (${circles.length})</h4><div class="need-list">${circles.length ? circles.map(c => `<div class="need"><b>${esc(c.name)}</b><small>Members: ${c.members?.length || 0} · Focus: ${esc(c.focus)}</small></div>`).join('') : '<p class="muted">No Circles formed yet.</p>'}</div></div><div class="platform-card"><h4>Circle Governance</h4><p>Each Circle of 7-13 operates as a sovereign civic node.</p><div class="success" style="margin-top:10px">● Live SSE Sync Active</div></div></div>`; }
async function runCircleMatch(){ try { const res = await api('/api/circles/match', { method:'POST' }); alert(`Auto-Match complete. Created ${res.circlesCreated} new Circle(s).`); await loadAdmin(); tab='circles'; render(); } catch(e){ alert(e.message); } }
function exportPanel(){ $('#adminApp').innerHTML=`<div class="platform-grid"><div class="platform-card"><h4>Export citizens CSV</h4><p>Download a working organizer spreadsheet.</p><button class="btn btn-primary" onclick="exportCSV()">Download CSV</button></div><div class="platform-card"><h4>Formation questions answered</h4><p>Who is ready? Where are they? What do they care about? Who can organize? Which Circle forms first?</p></div><div class="platform-card"><h4>Security</h4><p>Only admin/organizer accounts can access this area. Citizen dashboards only expose each citizen’s own private data.</p></div></div>`; }
function exportCSV(){ const cols=['name','email','phone','location','code','status','suggestedRole','circlePath','assignedCircle','priorities','skills']; const csv=[cols.join(',')].concat(state.citizens.map(u=>{const p=u.profile||{}; const r={...p,email:u.email,priorities:(p.priorities||[]).join('; '),skills:(p.skills||[]).join('; ')}; return cols.map(c=>'"'+String(r[c]||'').replace(/"/g,'""')+'"').join(',');})).join('\n'); const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='milyfe-citizens.csv'; a.click(); URL.revokeObjectURL(url); }
init();
</script></body></html>
