:root{--navy:#07335f;--blue:#087fa8;--teal:#00a991;--mint:#ddfbf5;--aqua:#effcfd;--cream:#fff8eb;--gold:#f3b347;--ink:#183246;--muted:#66798b;--line:#d8eaee;--white:#fff;--soft:#f6fbfc;--rose:#b83357;--shadow:0 18px 48px rgba(7,51,95,.12);--radius:28px;--max:1180px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.55;background:radial-gradient(circle at 0 0,rgba(0,169,145,.14),transparent 34rem),radial-gradient(circle at 90% 6%,rgba(8,127,168,.12),transparent 30rem),linear-gradient(180deg,#fff 0,#f7fcfd 48%,#fff8eb 100%)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}img{max-width:100%;display:block}.wrap{width:min(var(--max),calc(100% - 36px));margin:0 auto}.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(216,234,238,.85)}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:22px}.logo img{width:158px}.links{display:flex;align-items:center;gap:22px;color:var(--muted);font-weight:800;font-size:.96rem}.links a:hover{color:var(--blue)}.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:950;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s ease;white-space:nowrap}.btn-primary{background:linear-gradient(135deg,var(--blue),var(--teal));color:white;box-shadow:0 12px 28px rgba(0,169,145,.22)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,169,145,.30)}.btn-soft{background:white;color:var(--navy);border:1px solid var(--line)}.btn-gold{background:var(--cream);border:1px solid #efd59e;color:#7a5815}.hero{padding:76px 0 58px}.hero-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:48px;align-items:center}.badge{display:inline-flex;align-items:center;gap:9px;background:var(--mint);border:1px solid #b9e <script>
let ML_CSRF = '';
let ML_USER = null;
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function esc(v){ return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])); }
async function api(path, opts={}){
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if(ML_CSRF && !['GET','HEAD'].includes(opts.method || 'GET')) headers['x-csrf-token'] = ML_CSRF;
  const res = await fetch(path, { credentials:'same-origin', ...opts, headers, body: opts.body && typeof opts.body !== 'string' ? JSON.stringify(opts.body) : opts.body });
  let data = {}; try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
async function loadMe(required=false, roles=null){
  try{
    const data = await api('/api/me'); ML_CSRF = data.csrf; ML_USER = data.user;
    if(roles && !roles.includes(ML_USER.role)) location.href='/citizen';
    return ML_USER;
  }catch(e){ if(required) location.href='/login.html?next=' + encodeURIComponent(location.pathname); return null; }
}
async function logout(){ try{ await api('/api/auth/logout', { method:'POST' }); }catch(e){} location.href='/'; }
function setNavUser(){ const el=$('#navUser'); if(el && ML_USER) el.textContent = ML_USER.profile?.firstName || ML_USER.profile?.name || ML_USER.email; }
function missionsFor(profile={}){
  const role = profile.suggestedRole || 'Founding Citizen';
  const base = ['Share your invite with 3 people','Add one community need to your Values Agenda','Save your first assembly RSVP'];
  if(role === 'Circle Organizer') return ['Identify 3 people to invite','Choose a possible meeting place','Save your first assembly RSVP','Add one community need to your Values Agenda','Share your invite with 3 people'];
  if(role === 'Builder') return ['List what you can build or create','Share your invite with 3 people','Add one community need to your Values Agenda','Save your first assembly RSVP'];
  if(role === 'Community Partner') return ['Add your organization or group name','Invite your community contact','Save your first assembly RSVP','Add one community need to your Values Agenda'];
  if(role === 'Formation Support') return ['Choose your support lane','Add one community need to your Values Agenda','Share your invite with 3 people','Save your first assembly RSVP'];
  return base;
}
function inviteUrl(profile){ return location.origin + (profile.inviteLink || `/onboarding.html?invite=${encodeURIComponent(profile.code || '')}`); }
async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); alert('Copied.'); }catch(e){ prompt('Copy this:', txt); } }
function formData(form){ const fd = new FormData(form); const out = {}; for(const [k,v] of fd.entries()){ if(out[k]) out[k] = Array.isArray(out[k]) ? [...out[k], v] : [out[k], v]; else out[k]=v; } return out; }

let state={}; let tab='pass';
async function init(){ await loadMe(true); setNavUser(); if(['admin','organizer'].includes(ML_USER.role)) $('#adminLink').style.display='inline-flex'; await loadDash(); }
async function loadDash(){ state=await api('/api/dashboard'); render(); }
function render(){ const p=state.user.profile||{}; const missions=state.missions||missionsFor(p); const done=missions.filter(m=>state.missionState&&state.missionState[m]).length; const pct=missions.length?Math.round(done/missions.length*100):0; $('#app').innerHTML=`<section class="dash-hero"><div><h1>Welcome, ${esc(p.firstName||p.name||'Citizen')}.</h1><p>${esc(p.circleStatus||'Your Circle path is forming')}. Your private dashboard is active.</p><span class="status-pill" style="margin-top:14px">${esc(p.code)}</span></div><div class="dash-stats"><div class="dash-stat"><b>${esc(p.suggestedRole)}</b><span>Role</span></div><div class="dash-stat"><b>${esc((p.priorities||[]).length)}</b><span>Values</span></div><div class="dash-stat"><b>${done}/${missions.length}</b><span>Missions</span></div></div></section><div class="tabs">${['pass','values','circle','missions','invites','account','wealth','pod','standing','story','journey','class','discovery'].map(t=>`<button class="tab-btn ${tab===t?'active':''}" onclick="tab='${t}';render()">${title(t)}</button>`).join('')}</div><div>${panel(tab,p,missions,pct)}</div><button class="btn btn-primary slm-float-btn" onclick="toggleSLMDrawer()" style="position:fixed;bottom:24px;right:24px;z-index:99;box-shadow:0 12px 34px rgba(7,51,95,.25)">💬 Ask SLM Ribosome</button><aside id="slmDrawer" style="display:none;position:fixed;bottom:80px;right:24px;width:380px;max-width:calc(100vw - 32px);background:white;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 64px rgba(7,51,95,.25);z-index:100;overflow:hidden"><div style="background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center"><b>SLM Ribosome Co-Pilot</b><button onclick="toggleSLMDrawer()" style="background:transparent;border:0;color:white;font-weight:900;cursor:pointer">✕</button></div><div id="slmChatBody" style="height:260px;overflow-y:auto;padding:16px;background:#f8fcfd;font-size:.92rem;color:var(--ink)"><div class="success" style="margin-bottom:10px"><b>Ribosome Co-Pilot:</b> I am your on-device civic assistant. I am aware of your current tab and can help you navigate MiStanding, MiStory, MiJourney, MiClass, or MiDiscovery!</div></div><div style="padding:12px;border-top:1px solid var(--line);background:white;display:flex;gap:8px"><input id="slmDrawerInput" placeholder="Ask anything..." style="flex:1;border:1px solid #cfe0e6;border-radius:12px;padding:10px 12px" onkeydown="if(event.key==='Enter')sendSLMChat()"><button class="btn btn-primary" onclick="sendSLMChat()">Send</button></div></aside>`; }
function title(t){ return {pass:'Citizen Pass',values:'Values Agenda',circle:'Circle Hub',missions:'Role Missions',invites:'Invite Center',account:'Account / Privacy',wealth:'Wealth / MLY',pod:'Data Pod',standing:'MiStanding',story:'MiStory',journey:'MiJourney',class:'MiClass',discovery:'MiDiscovery'}[t]; }
function panel(t,p,missions,pct){ if(t==='pass') return passPanel(p,pct); if(t==='values') return valuesPanel(p); if(t==='circle') return circlePanel(p); if(t==='missions') return missionsPanel(p,missions,pct); if(t==='invites') return invitePanel(p); if(t==='wealth') return wealthPanel(p); if(t==='pod') return podPanel(p); if(t==='standing') return standingPanel(p); if(t==='story') return storyPanel(p); if(t==='journey') return journeyPanel(p); if(t==='class') return classPanel(p); if(t==='discovery') return discoveryPanel(p); return accountPanel(p); }
function standingPanel(p){ return `<div class="platform-grid"><div class="platform-card"><h4>MiStanding (Reputation & Rewards)</h4><p>Non-extractive soulbound civic reputation earned through positive service.</p><div class="tag-row"><span class="tag">50 Standing</span><span class="tag">Fibonacci Level 3</span><span class="tag">Soulbound W3C Badge</span></div></div><div class="platform-card"><h4>Fibonacci Level-Up Progression</h4><p>Current Progress toward Level 5 (80 Standing):</p><div class="meter" style="margin:12px 0"><span style="width:62%"></span></div><small class="muted">50/80 Standing complete. Attend your next Circle assembly for +10 Standing.</small></div><div class="platform-card"><h4>Civic Rewards & Privileges</h4><div class="need-list"><div class="need"><b>Level 3 Unlocked: MIP Voting</b><small>Cast signed supermajority votes in your Circle.</small></div><div class="need"><b>Level 5 Target: Proposal Sponsorship</b><small>Sponsor local community budget allocations.</small></div><div class="need"><b>Level 8 Target: Circle Stewardship</b><small>Mentor emerging Circles and moderate assemblies.</small></div></div></div></div>`; }
function storyPanel(p){ return `<div class="platform-grid"><div class="platform-card"><h4>MiStory (Collective Chronicle)</h4><p>Your civic history woven into the Living Tapestry.</p><div class="tag-row"><span class="tag">Level 1 ZK Attestation</span><span class="tag">Semaphore Protocol</span></div></div><div class="platform-card"><h4>Zero-Knowledge (ZK) Opt-In Controls</h4><p>Select how your achievements appear in the Collective Chronicle:</p><div class="mini-form"><select id="zkLevel"><option value="0">Level 0: 100% Private (Vault Only)</option><option value="1" selected>Level 1: Anonymized ZK Attestation</option><option value="2">Level 2: Public Attribution</option></select><button class="btn btn-primary" onclick="alert('MiStory ZK privacy level updated.')">Save Privacy Dial</button></div></div><div class="platform-card"><h4>Circle Tapestry Feed</h4><div class="need-list"><div class="need"><b>Circle #1 Founded in Jacksonville, FL</b><small>7 verified founding citizens assembled.</small></div><div class="need"><b>MIP #1 Passed (67% Supermajority)</b><small>200 MLY allocated for Circle community solar array.</small></div></div></div></div>`; }
function journeyPanel(p){ const steps = [{ n:1, title:'First Light (Visitor)', desc:'Discovered the 5 Charter principles.' },{ n:2, title:'Birth (Onboarding)', desc:'Created encrypted local Vault & Citizen Pass.' },{ n:3, title:'Orientation (Values)', desc:'Selected core community priorities.' },{ n:4, title:'Dyad (Connection)', desc:'Shared invite link with trusted peers.' },{ n:5, title:'Circle Matching (7-13)', desc:'Matched into local founding Circle (Current Step).' },{ n:6, title:'First Assembly', desc:'Attend first Circle conversation & set norms.' },{ n:7, title:'Deliberation (MIP Voting)', desc:'Participate in 21-day supermajority voting.' },{ n:8, title:'Stewardship (Mastery)', desc:'Complete role missions & mentor peers.' },{ n:9, title:'Sovereignty (Treasury)', desc:'Execute Word-to-Math community budgets.' },{ n:10, title:'Federation (Councils)', desc:'Federate with neighboring Circles of 49-91.' },{ n:11, title:'Heritage (Archiving)', desc:'Archive wisdom into immutable digital heritage.' }]; return `<div class="platform-grid" style="grid-template-columns:1fr"><div class="platform-card"><h4>MiJourney — 11-Stage Sovereign Citizen Journey Map</h4><p>Track your civic growth from First Light to Elder Stewardship.</p><div class="need-list" style="grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));display:grid;gap:12px;margin-top:14px">${steps.map(s => `<div class="need ${s.n<=5?'':'muted'}" style="${s.n===5?'border:2px solid var(--teal);background:var(--mint)':''}"><b>Step ${s.n}: ${esc(s.title)}</b><small>${esc(s.desc)}</small>${s.n===5?'<span class="tag" style="margin-top:6px">● CURRENT CIVIC STAGE</span>':s.n<5?'<span class="tag" style="margin-top:6px">✓ COMPLETED</span>':''}</div>`).join('')}</div></div></div>`; }
function classPanel(p){ return `<div class="platform-grid"><div class="platform-card"><h4>MiClass — Civic Literacy & Learning Center</h4><p>Self-paced learning modules on sovereign governance.</p><div class="need-list"><div class="need"><b>Module 1: Rights of the Sovereign Citizen</b><small>1787 to the Digital Age (+5 Standing)</small><div class="platform-actions" style="margin-top:6px"><button class="btn btn-soft" onclick="completeModule(1)">Start Micro-Lesson</button></div></div><div class="need"><b>Module 2: Why 67% Supermajority Works</b><small>Protecting minority voices (+5 Standing)</small><div class="platform-actions" style="margin-top:6px"><button class="btn btn-soft" onclick="completeModule(2)">Start Micro-Lesson</button></div></div></div></div><div class="platform-card" style="grid-column: span 2"><h4>The United States Constitution Bridge</h4><p>How MiLyfe's 5 Charter Principles connect directly to constitutional rights:</p><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Charter Principle</th><th>U.S. Constitution Alignment</th><th>Civic Synthesis</th></tr></thead><tbody><tr><td><b>1. Value / Ownership</b></td><td>4th & 5th Amendments</td><td>Protection against unreasonable seizure; right to due process & private property.</td></tr><tr><td><b>2. Voice / Consent</b></td><td>1st Amendment</td><td>Freedom of Speech, Assembly, & right to petition without censorship.</td></tr><tr><td><b>3. Action / Sovereignty</b></td><td>9th & 10th Amendments</td><td>Rights retained by the people; powers reserved to local communities.</td></tr><tr><td><b>4. Transparent Inspection</b></td><td>Article I, Section 9</td><td>Public statement and account of receipts and expenditures before funds move.</td></tr><tr><td><b>5. Dignity / Recycling</b></td><td>8th Amendment & Public Trust</td><td>Protection against excessive harm; stewardship of common heritage.</td></tr></tbody></table></div></div></div>`; }
function discoveryPanel(p){ return `<div class="platform-grid"><div class="platform-card"><h4>MiDiscovery — Academia (R&D) & Formal Verification</h4><p>Proving mathematical safety before any formula executes.</p><div class="tag-row"><span class="tag">Lean 4 Theorem Prover</span><span class="tag">Zero-Deprivation Proofs</span></div><div class="success" style="margin-top:14px">● All Ledger formulas formally verified against Charter constraints</div></div><div class="platform-card"><h4>Open Civic Science Portal</h4><p>Anonymized differential privacy datasets for researchers.</p><div class="need-list"><div class="need"><b>Dataset: 67% Supermajority Velocity</b><small>Anonymized quorum deliberation timing.</small></div><div class="need"><b>Dataset: Mutual-Aid Currency Circulation</b><small>Local $MLY velocity vs fiat extraction.</small></div></div></div><div class="platform-card"><h4>Academic Advisory Council</h4><p>Peer-reviewed transparency and constitutional alignment reports.</p><div class="platform-actions" style="margin-top:14px"><button class="btn btn-soft" onclick="alert('Downloading Annual MiDiscovery Academia Report...')">Download 2026 Report</button></div></div></div>`; }

function wealthPanel(p){ const ledger = state.ledger || []; return `<div class="platform-grid"><div class="platform-card"><h4>Your Sovereign Treasury</h4><p>Verify-before-act Word-to-Math Ledger.</p><div class="tag-row"><span class="tag">${state.balanceMLY || 500} $MLY</span><span class="tag">${state.standing || 50} Standing</span></div></div><div class="platform-card"><h4>Draft Natural Language Formula</h4><p>Try: "Allocate 150 MLY for Circle community garden"</p><div class="mini-form"><input id="formulaText" placeholder="Enter formula..."><button class="btn btn-primary" onclick="draftFormula()">Draft Formula AST</button></div><div id="formulaPreview"></div></div><div class="platform-card"><h4>Immutable Ledger</h4><div class="need-list">${ledger.length ? ledger.map(tx => `<div class="need"><b>${esc(tx.action)} ${esc(tx.amount)} ${esc(tx.asset)}</b><small>Target: ${esc(tx.target)}<br>Sig: ${esc((tx.signature||'').slice(0,16))}...</small></div>`).join('') : '<div class="muted">No ledger transactions yet.</div>'}</div></div></div>`; }
function podPanel(p){ return `<div class="platform-grid"><div class="platform-card"><h4>Sovereign Data Pod</h4><p>You own 100% of your data and history.</p><div class="tag-row"><span class="tag">Solid-Pod JSON-LD</span><span class="tag">Zero Vendor Lock-in</span></div><div class="platform-actions" style="margin-top:14px"><button class="btn btn-primary" onclick="exportPod()">Download Complete Solid-Pod</button></div></div><div class="platform-card"><h4>Real-Time Connection Status</h4><p>Server-Sent Events (SSE) live push is active.</p><div class="success" style="margin-top:10px">● Live SSE Stream Connected</div></div><div class="platform-card"><h4>Charter & MIP Governance</h4><p>5 Charter principles verified on-device before any action is executed.</p></div></div>`; }
async function draftFormula(){ const text = $('#formulaText').value.trim(); if(!text) return alert('Enter a formula proposal first.'); try { const res = await api('/api/formulas/review', { method:'POST', body: { text } }); window.lastAst = res.ast; $('#formulaPreview').innerHTML = `<div class="success" style="margin-top:10px"><b>AST Drafted:</b> ${esc(res.ast.action)} ${esc(res.ast.amount)} ${esc(res.ast.asset)} for ${esc(res.ast.target)}<br>Charter Compliant: <b>${res.ast.charterCompliant?'YES':'NO (Violation)'}</b></div><button class="btn btn-primary" onclick="approveFormula('${res.ast.id}')">Approve & Sign</button>`; } catch(e){ alert(e.message); } }
async function approveFormula(astId){ try { await api('/api/formulas/approve', { method:'POST', body: { astId } }); await loadDash(); tab='wealth'; render(); } catch(e){ alert(e.message); } }
async function exportPod(){ try { const data = await api('/api/export/pod'); const blob = new Blob([JSON.stringify(data.pod, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `solid-pod-export-${state.user.id}.jsonld`; a.click(); URL.revokeObjectURL(url); } catch(e){ alert(e.message); } }

function valuesPanel(p){ const priorities=p.priorities||[]; return `<div class="platform-grid"><div class="platform-card"><h4>Your values</h4><p>These came from onboarding and shape your agenda.</p><div class="tag-row">${priorities.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="muted">No values selected.</span>'}</div></div><div class="platform-card"><h4>Add a community need</h4><div class="mini-form"><select id="needPriority">${priorities.map(x=>`<option>${esc(x)}</option>`).join('')||'<option>General</option>'}</select><textarea id="needText" placeholder="What does your community need?"></textarea><button class="btn btn-primary" onclick="saveNeed()">Add to agenda</button></div></div><div class="platform-card"><h4>Agenda items</h4><div class="need-list">${state.agenda.length?state.agenda.map(a=>`<div class="need"><b>${esc(a.priority)}</b><small>${esc(a.text)}</small><div class="platform-actions"><button class="btn btn-soft" onclick="deleteNeed('${a.id}')">Remove</button></div></div>`).join(''):'<div class="muted">No agenda items yet.</div>'}</div></div></div>`; }

tatus: ${esc(mip.status)}</span><span class="tag">${yesCount}/${totalCount} YES (${pct}%)</span><span class="tag">Quorum: ${totalCount}/7</span></div><div class="platform-actions"><button class="btn btn-primary" onclick="voteMIP('${mip.id}', 'YES')">Vote YES</button><button class="btn btn-soft" onclick="voteMIP('${mip.id}', 'NO')">Vote NO</button><button class="btn btn-soft" onclick="voteMIP('${mip.id}', 'ABSTAIN')">Abstain</button></div></div>`; }).join('') : '<p class="muted">No active proposals in your Circle.</p>'}</div></div><div class="platform-card"><h4>Upcoming assemblies</h4>${state.events.length?state.events.map(e=>`<div class="row-card"><b>${esc(e.title)}</b><br>${esc(e.date)} · ${esc(e.location)}<br><span class="muted">${esc(e.notes)}</span></div>`).join(''):'<p class="muted">No assemblies scheduled yet.</p>'}</div></div>`; }
function missionsPanel(p,missions,pct){ return `<div class="platform-grid"><div class="platform-card"><h4>${esc(p.suggestedRole)} missions</h4><p>Tasks generated from onboarding.</p><div class="meter"><span style="width:${pct}%"></span></div><div class="mission-list">${missions.map(m=>`<label class="mission ${state.missionState[m]?'done':''}"><input type="checkbox" ${state.missionState[m]?'checked':''} onchange="toggleMission('${esc(m)}',this.checked)"> ${esc(m)}</label>`).join('')}</div></div><div class="platform-card"><h4>Your support lane</h4><div class="tag-row">${(p.skills||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="muted">No skills selected.</span>'}</div></div><div class="platform-card"><h4>Next contact</h4><p>Preferred: <b>${esc(p.contactPref||'Email')}</b></p><p>Availability: <b>${esc(p.availability||'Not selected')}</b></p></div></div>`; }
function invitePanel(p){ const sent=state.invites.filter(i=>i.sent).length; return `<div class="platform-grid"><div class="platform-card"><h4>Your invite link</h4><div class="copy-field" id="inviteText">${esc(inviteUrl(p))}</div><div class="platform-actions"><button class="btn btn-primary" onclick="copyText($('#inviteText').textContent)">Copy link</button><button class="btn btn-soft" onclick="shareInvite()">Share</button></div></div><div class="platform-card"><h4>Invite tracker</h4><p>${sent}/${state.invites.length||3} invites marked sent.</p><div class="mini-form"><div class="inline-fields"><input id="inviteName" placeholder="Name"><input id="inviteContact" placeholder="Phone or email"></div><button class="btn btn-primary" onclick="addInvite()">Add invite</button></div></div><div class="platform-card"><h4>People to invite</h4><div class="invite-list">${state.invites.length?state.invites.map(i=>`<div class="invite-item"><b>${esc(i.name)}</b><small>${esc(i.contact||'No contact')} · ${i.sent?'Sent':'Not sent yet'}</small><div class="platform-actions"><button class="btn btn-soft" onclick="markInvite('${i.id}',${!i.sent})">${i.sent?'Undo':'Mark sent'}</button><button class="btn btn-soft" onclick="deleteInvite('${i.id}')">Remove</button></div></div>`).join(''):'<p class="muted">Add three people you want to invite.</p>'}</div></div></div>`; }
function accountPanel(p){ return `<div class="platform-grid"><div class="platform-card"><h4>Contact</h4><p>${esc(state.user.email)}<br>${esc(p.phone||'No phone added')}<br>${esc(p.location)}</p></div><div class="platform-card"><h4>Data export</h4><p>Download your dashboard data.</p><button class="btn btn-primary" onclick="exportPass()">Export my data</button></div><div class="platform-card"><h4>Privacy</h4><p>Your dashboard is private to your login. Organizers/admins can use limited formation data to match Circles and schedule assemblies.</p></div></div>`; }
function wealthPanel(p){ const ledger = state.ledger || []; return `<div class="platform-grid"><div class="platform-card"><h4>Your Sovereign Treasury</h4><p>Verify-before-act Word-to-Math Ledger.</p><div class="tag-row"><span class="tag">${state.balanceMLY || 500} $MLY</span><span class="tag">${state.standing || 50} Standing</span></div></div><div class="platform-card"><h4>Draft Natural Language Formula</h4><p>Try: "Allocate 150 MLY for Circle community garden"</p><div class="mini-form"><input id="formulaText" placeholder="Enter formula..."><button class="btn btn-primary" onclick="draftFormula()">Draft Formula AST</button></div><div id="formulaPreview"></div></div><div class="platform-card"><h4>SLM Ribosome Local AI Co-Pilot</h4><p>Zero cloud surveillance on-device co-pilot.</p><div class="mini-form"><input id="slmPrompt" placeholder="Ask Ribosome to draft formula or explain rules..."><div class="platform-actions"><button class="btn btn-primary" onclick="askSLM('draft_formula')">Draft AST</button><button class="btn btn-soft" onclick="askSLM('explain_rules')">Explain Charter</button></div></div><div id="slmReply" style="margin-top:10px"></div></div><div class="platform-card"><h4>Immutable Ledger</h4><div class="need-list">${ledger.length ? ledger.map(tx => `<div class="need"><b>${esc(tx.action)} ${esc(tx.amount)} ${esc(tx.asset)}</b><small>Target: ${esc(tx.target)}<br>Sig: ${esc((tx.signature||'').slice(0,16))}...</small></div>`).join('') : '<div class="muted">No ledger transactions yet.</div>'}</div></div></div>`; }
function podPanel(p){ const did = state.user.did || 'Not generated yet'; return `<div class="platform-grid"><div class="platform-card"><h4>Sovereign Data Pod</h4><p>You own 100% of your data and history.</p><div class="tag-row"><span class="tag">Solid-Pod JSON-LD</span><span class="tag">Zero Vendor Lock-in</span></div><div class="platform-actions" style="margin-top:14px"><button class="btn btn-primary" onclick="exportPod()">Download Complete Solid-Pod</button></div></div><div class="platform-card"><h4>Sovereign Key Management & Spore Seed</h4><p>DID: <b style="word-break:break-all">${esc(did)}</b></p><div class="platform-actions" style="margin-top:10px"><button class="btn btn-primary" onclick="generateSporeSeed()">Generate 12-Word Spore Seed</button><button class="btn btn-soft" onclick="registerPasskey()">Register Passkey (WebAuthn)</button></div><div id="sporeSeedBox" style="margin-top:10px"></div></div><div class="platform-card"><h4>Zero-Knowledge (ZK) Telemetry</h4><p>Control interoception and exteroception sharing.</p><label style="display:flex;gap:8px;align-items:center;font-weight:800;margin-top:10px"><input type="checkbox" id="zkConsent" ${state.user.zkConsent?'checked':''} onchange="toggleZKConsent(this.checked)"> Allow Exteroception Telemetry (Charter Rule 2)</label></div><div class="platform-card"><h4>Real-Time Connection Status</h4><p>Server-Sent Events (SSE) live push is active.</p><div class="success" style="margin-top:10px">● Live SSE Stream Connected</div></div></div>`; }
async function createMIP(){ const title = $('#mipTitle')?.value.trim(); const description = $('#mipDesc')?.value.trim(); if(!title) return alert('Proposal title required.'); try { await api('/api/circles/proposals', { method:'POST', body:{ title, description } }); await loadDash(); tab='circle'; render(); } catch(e){ alert(e.message); } }
async function voteMIP(proposalId, vote){ try { await api('/api/circles/proposals/vote', { method:'POST', body:{ proposalId, vote } }); await loadDash(); tab='circle'; render(); } catch(e){ alert(e.message); } }

async function toggleZKConsent(checked){ try { await api('/api/profile', { method:'PUT', body:{ zkConsent: checked } }); alert(checked ? 'Exteroception ZK Telemetry consent granted.' : 'Exteroception ZK Telemetry consent revoked.'); } catch(e){ alert(e.message); } }
async function saveNeed(){ const text=$('#needText').value.trim(); if(!text) return alert('Write the need first.'); await api('/api/agenda',{method:'POST',body:{priority:$('#needPriority').value,text}}); await loadDash(); tab='values'; render(); }
async function deleteNeed(id){ await api('/api/agenda/'+id,{method:'DELETE'}); await loadDash(); tab='values'; render(); }
async function saveAssembly(){ await api('/api/assembly',{method:'PUT',body:{rsvp:$('#rsvp').value,availability:$('#avail').value,note:$('#note').value}}); await loadDash(); tab='circle'; render(); }
async function toggleMission(m,done){ await api('/api/missions',{method:'PUT',body:{mission:m,done}}); await loadDash(); tab='missions'; render(); }
async function addInvite(){ const name=$('#inviteName').value.trim(); if(!name) return alert('Add a name.'); await api('/api/invites',{method:'POST',body:{name,contact:$('#inviteContact').value}}); await loadDash(); tab='invites'; render(); }
async function markInvite(id,sent){ await api('/api/invites/'+id,{method:'PUT',body:{sent}}); await loadDash(); tab='invites'; render(); }
async function deleteInvite(id){ await api('/api/invites/'+id,{method:'DELETE'}); await loadDash(); tab='invites'; render(); }
async function shareInvite(){ const p=state.user.profile; const text=`Join me on MiLyfe. New Govt Starts Now. ${inviteUrl(p)}`; if(navigator.share) await navigator.share({title:'MiLyfe invite',text,url:inviteUrl(p)}); else copyText(text); }
function exportPass(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=(state.user.profile.code||'milyfe')+'-citizen-data.json'; a.click(); URL.revokeObjectURL(url); }
